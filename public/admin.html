<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理中心 - Resource Depot</title>
    <style>
        :root {
            --bg-color: oklch(0.12 0.01 250);
            --text-color: oklch(0.95 0.005 250);
            --accent-color: oklch(0.75 0.18 60);
            --card-bg: oklch(0.18 0.01 250);
        }
        body { background: var(--bg-color); color: var(--text-color); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding-bottom: 50px; }
        .panel { background: var(--card-bg); padding: 2rem; border-radius: 12px; margin-top: 50px; width: 95%; max-width: 800px; box-sizing: border-box; }
        input { background: rgba(0,0,0,0.2); border: 1px solid var(--accent-color); color: white; padding: 0.8rem; margin: 10px 0; width: 100%; box-sizing: border-box; border-radius: 8px; }
        button { background: var(--accent-color); border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        .tab-btn { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.1); margin-right: 10px; width: auto; }
        .tab-btn.active { border-color: var(--accent-color); color: var(--accent-color); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .action-btn { padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; margin-right: 5px; }
        #qr-container { margin-top: 20px; text-align: center; display: none; }
        #qr-container img { max-width: 200px; border: 5px solid white; }
    </style>
</head>
<body>
    <div class="panel" id="login-panel">
        <h2 style="color:var(--accent-color)">管理员登录</h2>
        <input type="password" id="admin-key" placeholder="输入 token.json 中的密钥">
        <p style="text-align:center; color:rgba(255,255,255,0.3)">- 或者使用 2FA -</p>
        <input type="text" id="otp-token" placeholder="输入 2FA 6位验证码">
        <button onclick="handleAdminLogin()" style="width:100%">登录管理中心</button>
    </div>

    <div class="panel" id="admin-dashboard" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="color:var(--accent-color)">管理控制台</h2>
            <button onclick="location.href='/'" style="background:transparent; color:white; border:1px solid white; font-size:0.8rem;">返回首页</button>
        </div>
        
        <div style="margin-top:20px;">
            <button class="tab-btn active" onclick="switchTab('files')">文件管理</button>
            <button class="tab-btn" onclick="switchTab('users')">用户管理</button>
            <button class="tab-btn" onclick="switchTab('settings')">安全设置</button>
        </div>

        <!-- 文件管理 -->
        <div id="tab-files" class="tab-content">
            <table>
                <thead>
                    <tr><th>文件名</th><th>所有者</th><th>操作</th></tr>
                </thead>
                <tbody id="files-list"></tbody>
            </table>
        </div>

        <!-- 用户管理 -->
        <div id="tab-users" class="tab-content" style="display:none;">
            <table>
                <thead>
                    <tr><th>用户名</th><th>状态</th><th>操作</th></tr>
                </thead>
                <tbody id="users-list"></tbody>
            </table>
        </div>

        <!-- 安全设置 -->
        <div id="tab-settings" class="tab-content" style="display:none;">
            <h3>2FA 身份验证器</h3>
            <button onclick="setup2FA()" style="background:transparent; border:1px solid var(--accent-color); color:var(--accent-color);">重新配置 2FA 二维码</button>
            <div id="qr-container">
                <p>使用 Google Authenticator 扫描：</p>
                <img id="qr-image" src="" alt="2FA QR Code">
                <p id="secret-text" style="font-size:0.8rem; margin-top:10px;"></p>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'files';

        async function handleAdminLogin() {
            const key = document.getElementById('admin-key').value;
            const otpToken = document.getElementById('otp-token').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, otpToken })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                loadFiles();
            } else {
                alert(data.message);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.getElementById(`tab-${tab}`).style.display = 'block';
            if (tab === 'files') loadFiles();
            if (tab === 'users') loadUsers();
        }

        async function loadFiles() {
            const res = await fetch('/api/admin/files');
            const data = await res.json();
            const list = document.getElementById('files-list');
            list.innerHTML = data.files.map(f => `
                <tr>
                    <td>${f.filename}</td>
                    <td>${f.owner}</td>
                    <td>
                        <button class="action-btn" style="background:#ff4444; color:white;" onclick="deleteFile('${f.filename}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            const list = document.getElementById('users-list');
            list.innerHTML = data.users.map(u => `
                <tr>
                    <td>${u.username}</td>
                    <td style="color:${u.isBanned ? '#ff4444' : '#44ff44'}">${u.isBanned ? '已封禁' : '正常'}</td>
                    <td>
                        <button class="action-btn" onclick="toggleBan('${u.username}')">${u.isBanned ? '解封' : '封禁'}</button>
                        <button class="action-btn" style="background:#ff4444; color:white;" onclick="deleteUser('${u.username}')">注销</button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteFile(filename) {
            if (!confirm(`确定要强制删除文件 ${filename} 吗？`)) return;
            const res = await fetch(`/api/delete/${filename}`, { method: 'DELETE' });
            const data = await res.json();
            alert(data.message);
            loadFiles();
        }

        async function toggleBan(username) {
            const res = await fetch(`/api/admin/toggle-ban/${username}`, { method: 'POST' });
            const data = await res.json();
            alert(data.message);
            loadUsers();
        }

        async function deleteUser(username) {
            if (!confirm(`确定要彻底注销用户 ${username} 吗？`)) return;
            const res = await fetch(`/api/admin/user/${username}`, { method: 'DELETE' });
            const data = await res.json();
            alert(data.message);
            loadUsers();
        }

        async function setup2FA() {
            const res = await fetch('/api/admin/setup-2fa');
            const data = await res.json();
            if (res.ok) {
                document.getElementById('qr-image').src = data.qrCode;
                document.getElementById('secret-text').innerText = "密钥: " + data.secret;
                document.getElementById('qr-container').style.display = 'block';
            }
        }
    </script>
</body>
</html>
