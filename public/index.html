<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源分享中心 - 科技感黑金版</title>
    <style>
        /* Tweaks 变量 */
        :root {
            --bg-color: oklch(0.12 0.01 250);
            --text-color: oklch(0.95 0.005 250);
            --accent-color: oklch(0.75 0.18 60);
            --card-bg: oklch(0.18 0.01 250);
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }
        header { width: 100%; padding: 2rem; text-align: center; border-bottom: 1px solid var(--card-bg); }
        h1 { color: var(--accent-color); }
        .container { width: 90%; max-width: 800px; margin-top: 2rem; }
        
        /* 提升卡片视觉质感 */
        .resource-card, .auth-box, .upload-box { 
            background: var(--card-bg); 
            padding: 1.5rem; 
            margin-bottom: 1rem; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .resource-card:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        /* 统一输入框与按钮风格 */
        input { 
            background: rgba(0,0,0,0.2); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: white; 
            padding: 0.8rem; 
            margin: 0.5rem 0; 
            width: 100%; 
            border-radius: 8px; 
            box-sizing: border-box;
        }
        button { 
            background: var(--accent-color); 
            color: black; 
            padding: 0.8rem 1.5rem; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            font-weight: 700;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        /* 下载按钮特定样式 */
        .btn-download {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-download:hover {
            background: var(--accent-color);
            color: black;
        }
    </style>
    <div id="version-info" style="position:fixed; bottom:10px; left:10px; color:rgba(255,255,255,0.3); font-size:0.8rem;">
        v1.0.0
    </div>

    <div id="tweaks-panel" style="position:fixed; bottom:20px; right:20px; background:var(--card-bg); padding:1rem; border-radius:8px; border:1px solid var(--accent-color);">
        <h4>Tweaks</h4>
        <input type="color" id="accentPicker" value="#d4af37">
        <button onclick="updateAccent()">应用金色主题</button>
    </div>
    <script>
        function updateAccent() {
            const color = document.getElementById('accentPicker').value;
            document.documentElement.style.setProperty('--accent-color', color);
        }
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        .cf-turnstile { margin: 1rem 0; }
    </style>
</head>
<body>
    <div id="gateway-modal" style="display:flex; flex-direction:column; align-items:center; justify-content:center; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-color); z-index:1000;">
        <h2 style="color:var(--accent-color); margin-bottom:2rem;">安全验证</h2>
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADHW2C26hJsRbWjA" data-callback="onGatewayVerified"></div>
        <p style="margin-top:1rem; color:rgba(255,255,255,0.5);">请完成验证以进入网站</p>
    </div>

    <header style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--card-bg);">
        <h1>Resource Depot</h1>
        <div id="auth-header">
            <button onclick="document.getElementById('auth-modal').style.display='block'">登录/注册</button>
        </div>
    </header>

    <div id="auth-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--card-bg); padding:2rem; border-radius:12px; z-index:100; border:1px solid var(--accent-color);">
        <h2>注册/登录</h2>
        <input type="text" id="username" placeholder="用户名">
        <input type="password" id="password" placeholder="密码">
        <button onclick="handleAuth('register')">注册</button>
        <button onclick="handleAuth('login')">登录</button>
        <button onclick="document.getElementById('auth-modal').style.display='none'" style="background:transparent; color:white;">关闭</button>
    </div>

    <div id="toast" style="display:none; position:fixed; top:20px; right:20px; background:var(--accent-color); color:black; padding:1rem; border-radius:8px; z-index:200;"></div>

    <script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        async function onGatewayVerified(token) {
            const res = await fetch('/api/verify-gateway', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ turnstileToken: token })
            });
            if (res.ok) {
                document.getElementById('gateway-modal').style.display = 'none';
                checkAuth();
                fetchResources();
            } else {
                showToast("验证失败，请刷新重试");
            }
        }
    </script>
    <div class="container">
        <div class="upload-box" id="upload-section" style="display:none;">
            <h2>上传资源</h2>
            <input type="file" id="fileInput">
            <button onclick="handleUpload()">上传</button>
        </div>
        <div id="app"></div>
    </div>
    <script>
        // 验证用户状态
        async function checkAuth() {
            const res = await fetch('/api/me');
            if (res.status === 403) {
                document.getElementById('gateway-modal').style.display = 'flex';
                return;
            }
            const authHeader = document.getElementById('auth-header');
            const uploadSection = document.getElementById('upload-section');
            if (res.ok) {
                const data = await res.json();
                authHeader.innerHTML = `<span>👤 ${data.username}</span>`;
                uploadSection.style.display = 'block';
            } else {
                authHeader.innerHTML = `<button onclick="document.getElementById('auth-modal').style.display='block'">登录/注册</button>`;
                uploadSection.style.display = 'none';
            }
        }

        async function handleAuth(type) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch(`/api/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            showToast(data.message);
            if (res.ok) {
                document.getElementById('auth-modal').style.display = 'none';
                checkAuth();
                fetchResources();
            } else if (data.needsGateway) {
                document.getElementById('gateway-modal').style.display = 'flex';
            }
        }
        
        async function fetchResources() {
            const res = await fetch('/api/resources');
            if (res.status === 403) {
                document.getElementById('gateway-modal').style.display = 'flex';
                return;
            }
            const data = await res.json();
            const app = document.getElementById('app');
            app.innerHTML = data.resources.map(file => `
                <div class="resource-card">
                    <span>${file}</span>
                    <a href="/uploads/${file}" download class="btn-download">下载</a>
                </div>
            `).join('');
        }
        
        async function handleUpload() {
            const fileInput = document.getElementById('fileInput');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            showToast(data.message);
            if (res.ok) {
                fetchResources();
            } else if (data.needsGateway) {
                document.getElementById('gateway-modal').style.display = 'flex';
            }
        }
    </script>
    <div class="container">
        <div class="upload-box" id="upload-section" style="display:none;">
            <h2>上传资源</h2>
            <input type="file" id="fileInput">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAADHW2C26hJsRbWjA" id="upload-turnstile"></div>
            <button onclick="handleUpload()">上传</button>
        </div>
        <div id="app"></div>
    </div>
    <script>
        // 验证用户状态
        async function checkAuth() {
            const res = await fetch('/api/me');
            const authHeader = document.getElementById('auth-header');
            const uploadSection = document.getElementById('upload-section');
            if (res.ok) {
                const data = await res.json();
                authHeader.innerHTML = `<span>👤 ${data.username}</span>`;
                uploadSection.style.display = 'block';
            } else {
                authHeader.innerHTML = `<button onclick="document.getElementById('auth-modal').style.display='block'">登录/注册</button>`;
                uploadSection.style.display = 'none';
            }
        }
        checkAuth();

        async function handleAuth(type) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch(`/api/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            showToast(data.message);
            if (res.ok) {
                document.getElementById('auth-modal').style.display = 'none';
                checkAuth();
                fetchResources();
            } else if (data.needsGateway) {
                document.getElementById('gateway-modal').style.display = 'flex';
            }
        }
        
        async function fetchResources() {
            const res = await fetch('/api/resources');
            const data = await res.json();
            const app = document.getElementById('app');
            app.innerHTML = data.resources.map(file => `
                <div class="resource-card">
                    <span>${file}</span>
                    <a href="/uploads/${file}" download class="btn-download">下载</a>
                </div>
            `).join('');
        }
        fetchResources();
        
        async function handleUpload() {
            const fileInput = document.getElementById('fileInput');
            const tokenElement = document.querySelector('#upload-section [name=cf-turnstile-response]');
            const turnstileToken = tokenElement ? tokenElement.value : '';
            
            if (!turnstileToken) {
                showToast("Request failed : CAPTCHA timeout");
                console.log("No upload turnstile token found");
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('turnstileToken', turnstileToken);
            
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            showToast((await res.json()).message);
            fetchResources();
        }
    </script>
</body>
</html>
