version: '3.8'

services:
  app:
    build: 
      context: .
      args:
        - BUILD_DATE=${BUILD_DATE:-20260503}
    container_name: resource-depot
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - BUILD_DATE=${BUILD_DATE:-20260503}
